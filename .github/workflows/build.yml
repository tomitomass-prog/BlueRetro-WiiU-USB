name: Build ESP32-S2 firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uart-tests:
    name: UART protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test packet protocol
        run: python tools/test_packets.py

  build-usb-s2:
    name: Build LOLIN S2 Mini (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('usb-s2/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile firmware
        run: python -m platformio run -d usb-s2 -e lolin_s2_mini
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: lolin-s2-mini-firmware
          path: |
            usb-s2/.pio/build/lolin_s2_mini/firmware.bin
            usb-s2/.pio/build/lolin_s2_mini/bootloader.bin
            usb-s2/.pio/build/lolin_s2_mini/partitions.bin
          if-no-files-found: error
          retention-days: 14
